<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mindmap Canvas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="toolbar">
    <div class="brand">Mindmap</div>
    <div class="group">
      <button data-add="rect" title="사각형 추가">▭ 사각형</button>
      <button data-add="ellipse" title="원 추가">◯ 원</button>
      <button data-add="diamond" title="마름모 추가">◇ 마름모</button>
      <button data-add="text" title="텍스트 추가">T 텍스트</button>
    </div>
    <div class="group">
      <button id="btn-undo" title="실행 취소 (Ctrl+Z)">↶</button>
      <button id="btn-redo" title="다시 실행 (Ctrl+Shift+Z)">↷</button>
      <button id="btn-delete" title="선택 항목 삭제 (Delete)">삭제</button>
    </div>
    <div class="group">
      <button id="btn-zoom-out" title="축소">−</button>
      <span id="zoom-label">100%</span>
      <button id="btn-zoom-in" title="확대">+</button>
      <button id="btn-fit" title="전체 보기">전체 보기</button>
    </div>
    <div class="group right">
      <button id="btn-export" title="JSON으로 저장">내보내기</button>
      <button id="btn-import" title="JSON 불러오기">불러오기</button>
      <button id="btn-clear" title="모두 지우기">초기화</button>
      <input id="file-input" type="file" accept="application/json" hidden />
    </div>
  </header>

  <main id="viewport">
    <div id="world">
      <svg id="edges" width="1" height="1">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
            <path d="M0,1 L10,5 L0,9 z" class="arrow-head" />
          </marker>
          <marker id="arrow-selected" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
            <path d="M0,1 L10,5 L0,9 z" class="arrow-head selected" />
          </marker>
        </defs>
        <g id="edge-layer"></g>
        <path id="draft-edge" d="" />
      </svg>
      <div id="node-layer"></div>
    </div>
    <div class="hint">
      빈 곳 드래그: 이동 · 휠: 확대/축소 · 더블클릭: 이름 변경 · 점(●) 드래그: 화살표 연결 · 선택 후 +/−: 화살표 포트 개수 조절
    </div>
  </main>

  <aside id="panel" hidden>
    <section>
      <h4>이름</h4>
      <textarea id="prop-label" rows="2"></textarea>
    </section>

    <section>
      <h4>모양</h4>
      <div id="prop-type" class="segmented">
        <button data-type="rect" title="사각형"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="5" width="15" height="10" rx="2.5"/></svg></button>
        <button data-type="ellipse" title="원"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="10" cy="10" rx="7.5" ry="6"/></svg></button>
        <button data-type="diamond" title="마름모"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 2.5 17.5 10 10 17.5 2.5 10z" stroke-linejoin="round"/></svg></button>
        <button data-type="text" title="텍스트"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5h10M10 5v11" stroke-linecap="round"/></svg></button>
      </div>
    </section>

    <section>
      <h4>글자</h4>
      <div class="row">
        <select id="prop-weight" title="글자 굵기">
          <option value="100">Thin 100</option>
          <option value="200">ExtraLight 200</option>
          <option value="300">Light 300</option>
          <option value="400">Regular 400</option>
          <option value="500">Medium 500</option>
          <option value="600">SemiBold 600</option>
          <option value="700">Bold 700</option>
          <option value="800">ExtraBold 800</option>
          <option value="900">Black 900</option>
        </select>
        <div class="stepper size" title="글자 크기">
          <button data-size="-1">−</button>
          <input id="prop-size" type="number" min="8" max="120" step="1" />
          <button data-size="1">+</button>
        </div>
      </div>
      <div class="sub">글자색</div>
      <div id="prop-text-color" class="swatches"></div>
    </section>

    <section>
      <h4>채우기</h4>
      <div id="prop-fill" class="swatches"></div>
    </section>

    <section>
      <h4>외곽선</h4>
      <div id="prop-stroke" class="swatches"></div>
      <div class="sub">굵기 <b id="prop-stroke-width-label">1.5px</b></div>
      <input id="prop-stroke-width" type="range" min="0" max="12" step="0.5" />
    </section>

    <section>
      <h4>화살표 포트</h4>
      <div class="ports-row">
        <div>
          <span>왼쪽</span>
          <div class="stepper"><button data-port="left" data-d="-1">−</button><b id="prop-left">1</b><button data-port="left" data-d="1">+</button></div>
        </div>
        <div>
          <span>오른쪽</span>
          <div class="stepper"><button data-port="right" data-d="-1">−</button><b id="prop-right">1</b><button data-port="right" data-d="1">+</button></div>
        </div>
      </div>
    </section>
  </aside>

  <script src="app.js"></script>
</body>
</html>
