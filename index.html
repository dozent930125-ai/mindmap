<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mindmap Canvas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="toolbar">
    <div class="brand">Mindmap</div>
    <div class="group" data-edit>
      <button data-add="rect" title="사각형 추가"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="14" height="9" rx="2.5"/></svg><span class="t">사각형</span></button>
      <button data-add="ellipse" title="원 추가"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="10" cy="10" rx="7" ry="5.5"/></svg><span class="t">원</span></button>
      <button data-add="diamond" title="마름모 추가"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 17 10 10 17 3 10z"/></svg><span class="t">마름모</span></button>
      <button data-add="text" title="텍스트 추가"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h10M10 5v11"/></svg><span class="t">텍스트</span></button>
    </div>
    <div class="group" data-edit>
      <button id="btn-undo" title="실행 취소 (Ctrl+Z)"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5 3.5 8.5 7 12"/><path d="M4 8.5h8a4 4 0 0 1 0 8H9"/></svg></button>
      <button id="btn-redo" title="다시 실행 (Ctrl+Shift+Z)"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 5l3.5 3.5L13 12"/><path d="M16 8.5H8a4 4 0 0 0 0 8h3"/></svg></button>
      <button id="btn-delete" title="선택 항목 삭제 (Delete)"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10"/></svg><span class="t">삭제</span></button>
    </div>
    <div class="group">
      <button id="btn-zoom-out" title="축소"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 10h10"/></svg></button>
      <span id="zoom-label">100%</span>
      <button id="btn-zoom-in" title="확대"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 10h10M10 5v10"/></svg></button>
      <button id="btn-fit" title="도형 전체가 보이게 맞추기"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V4h4M16 8V4h-4M4 12v4h4M16 12v4h-4"/></svg><span class="t">전체 보기</span></button>
      <button id="btn-fullscreen" title="전체 화면" hidden><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V3h4M17 7V3h-4M3 13v4h4M17 13v4h-4M7 7h6v6H7z"/></svg><span class="t">전체 화면</span></button>
    </div>
    <div class="group right">
      <span id="mode-badge" class="badge" hidden>실시간 공유</span>
      <div class="menu-wrap">
        <button id="btn-more" title="더보기" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="4.5" cy="10" r=".6"/><circle cx="10" cy="10" r=".6"/><circle cx="15.5" cy="10" r=".6"/></svg></button>
        <div id="more-menu" class="menu" role="menu" hidden>
          <button id="btn-export" role="menuitem">내보내기 (JSON 저장)</button>
          <button id="btn-import" role="menuitem" data-edit>불러오기</button>
          <button id="btn-clear" role="menuitem" data-edit>초기화</button>
        </div>
      </div>
      <input id="file-input" type="file" accept="application/json" hidden />
      <button id="btn-chat" class="primary" title="Claude와 대화" hidden><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h12v8H9l-4 3v-3H4z"/></svg><span class="t">Claude와 대화</span></button>
    </div>
  </header>

  <main id="viewport">
    <div id="world">
      <svg id="edges" width="1" height="1">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
            <path d="M0,1 L10,5 L0,9 z" class="arrow-head" />
          </marker>
          <marker id="arrow-selected" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
            <path d="M0,1 L10,5 L0,9 z" class="arrow-head selected" />
          </marker>
        </defs>
        <g id="edge-layer"></g>
        <path id="draft-edge" d="" />
      </svg>
      <div id="node-layer"></div>
    </div>
    <div id="marquee"></div>
    <div id="loading-note" class="loading-note">마인드맵을 불러오는 중…</div>
    <div id="toast" class="toast" role="status" hidden></div>
    <div class="hint">
      왼쪽 드래그: 화면 이동 · 오른쪽 드래그: 여러 도형 선택 · 휠: 확대/축소 · Shift+클릭: 선택 추가 · 더블클릭: 이름 변경
    </div>
  </main>

  <aside id="panel" hidden>
    <button id="panel-toggle" class="panel-toggle" aria-expanded="true">
      <span>속성</span><span id="panel-title" class="panel-title" hidden></span>
      <svg class="chev" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8l4 4 4-4"/></svg>
    </button>
    <section id="label-section">
      <h4>이름</h4>
      <textarea id="prop-label" rows="2"></textarea>
    </section>

    <section>
      <h4>모양</h4>
      <div id="prop-type" class="segmented">
        <button data-type="rect" title="사각형"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="5" width="15" height="10" rx="2.5"/></svg></button>
        <button data-type="ellipse" title="원"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="10" cy="10" rx="7.5" ry="6"/></svg></button>
        <button data-type="diamond" title="마름모"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 2.5 17.5 10 10 17.5 2.5 10z" stroke-linejoin="round"/></svg></button>
        <button data-type="text" title="텍스트"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5h10M10 5v11" stroke-linecap="round"/></svg></button>
      </div>
    </section>

    <section>
      <h4>글자</h4>
      <div class="row">
        <select id="prop-weight" title="글자 굵기">
          <option value="100">Thin 100</option>
          <option value="200">ExtraLight 200</option>
          <option value="300">Light 300</option>
          <option value="400">Regular 400</option>
          <option value="500">Medium 500</option>
          <option value="600">SemiBold 600</option>
          <option value="700">Bold 700</option>
          <option value="800">ExtraBold 800</option>
          <option value="900">Black 900</option>
        </select>
        <div class="stepper size" title="글자 크기">
          <button data-size="-1">−</button>
          <input id="prop-size" type="number" min="8" max="120" step="1" />
          <button data-size="1">+</button>
        </div>
      </div>
      <div class="sub">글자색</div>
      <div id="prop-text-color" class="swatches"></div>
    </section>

    <section>
      <h4>채우기</h4>
      <div id="prop-fill" class="swatches"></div>
    </section>

    <section>
      <h4>외곽선</h4>
      <div id="prop-stroke" class="swatches"></div>
      <div class="sub">굵기 <b id="prop-stroke-width-label">1.5px</b></div>
      <input id="prop-stroke-width" type="range" min="0" max="12" step="0.5" />
    </section>

    <section>
      <h4>화살표 포트</h4>
      <div class="ports-row">
        <div>
          <span>왼쪽</span>
          <div class="stepper"><button data-port="left" data-d="-1">−</button><b id="prop-left">1</b><button data-port="left" data-d="1">+</button></div>
        </div>
        <div>
          <span>오른쪽</span>
          <div class="stepper"><button data-port="right" data-d="-1">−</button><b id="prop-right">1</b><button data-port="right" data-d="1">+</button></div>
        </div>
      </div>
    </section>
  </aside>

  <aside id="chat" aria-label="Claude 채팅" hidden>
    <header class="chat-head">
      <div class="chat-title">Claude</div>
      <select id="chat-model" title="모델 선택">
        <option value="quick">빠른 모델</option>
        <option value="default">기본 모델</option>
        <option value="complex">최고 성능 모델</option>
      </select>
      <button id="chat-close" class="icon" title="닫기">✕</button>
    </header>
    <div id="chat-mode" class="segmented chat-mode" role="tablist">
      <button data-mode="free" role="tab">그냥 대화</button>
      <button data-mode="map" role="tab">마인드맵 함께 편집</button>
    </div>
    <div id="chat-log" class="chat-log" aria-live="polite"></div>
    <div id="chat-context" class="chat-context"></div>
    <form id="chat-form" class="chat-form">
      <textarea id="chat-input" rows="2" placeholder="아이디어를 이야기해 보세요 (Enter 보내기, Shift+Enter 줄바꿈)"></textarea>
      <div class="chat-actions">
        <button type="button" id="chat-clear" class="ghost">대화 지우기</button>
        <button type="button" id="chat-stop" hidden>중지</button>
        <button type="submit" id="chat-send" class="primary">보내기</button>
      </div>
    </form>
  </aside>

  <script src="app.js"></script>
  <script src="chat.js"></script>
</body>
</html>
